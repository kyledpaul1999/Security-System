version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - security_system_network

  gateway:
    build:
      context: ./src/gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PORT}:3000"
    depends_on:
      api:
        condition: service_started
    environment:
      - API_SERVICE_URL=${API_SERVICE_URL}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - security_system_network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - security_system_network

  api:
    build:
      context: ./src/api
    container_name: api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./src/api:/home/appuser/app
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - STORAGE_BACKEND=${STORAGE_BACKEND}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
    networks:
      - security_system_network

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - security_system_network

  stream_processor:
    build:
      context: ./src/stream_processor
    container_name: stream_processor
    depends_on:
      - timescaledb
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=src.api.core.settings
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${POSTGRES_DB}
      - ZMQ_PUB_URL=${ZMQ_STREAM_PUB_URL}
      - RTSP_URLS=${RTSP_URLS}
    networks:
      - security_system_network

  person_detector:
    build:
      context: ./src/person_detector
    container_name: person_detector
    depends_on:
      - stream_processor
    environment:
      - ZMQ_SUB_URL=${ZMQ_DETECTOR_SUB_URL}
      - ZMQ_PUB_URL=${ZMQ_DETECTOR_PUB_URL}
      - MIN_CONTOUR_AREA=${MIN_CONTOUR_AREA}
    networks:
      - security_system_network

  event_handler:
    build:
      context: ./src/event_handler
    container_name: event_handler
    depends_on:
      - person_detector
      - timescaledb
    volumes:
      - ./src:/app/src
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=src.api.core.settings
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${POSTGRES_DB}
      - ZMQ_SUB_URL=${ZMQ_EVENT_SUB_URL}
    networks:
      - security_system_network

volumes:
  timescaledb_data:
  redis_data:
  minio_data:

networks:
  security_system_network:
    driver: bridge
